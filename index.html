<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Projectional Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench. Blocks and graph side by side as two views of one tree,
   text views beneath, and a narrow rail on the right for the selected node,
   the files on disk, and a live run. Block colours follow node categories. */
:root {
  --bg: #e9ece6;
  --panel: #f7f8f4;
  --fg: #1c2420;
  --muted: #5b6760;
  --line: #d0d6ce;
  --accent: #17706a;
  --accent-soft: #d3ebe7;
  --hot: #b4570f;
  --hot-soft: #f8e4d0;
  --op-bg: #dcebd4; --op-ln: #5f9150;
  --def-bg: #d8e5f3; --def-ln: #4a78a8;
  --var-bg: #f5e3c6; --var-ln: #b07c26;
  --let-bg: #e7def1; --let-ln: #7a5aa6;
  --lit-bg: #ecebe5; --lit-ln: #8a887c;
  --wire: #7d8a83;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --panel: #1a1f1c; --fg: #e2e8e3; --muted: #97a39c; --line: #2c3530;
    --accent: #5cc4b9; --accent-soft: #19332f; --hot: #f0a15c; --hot-soft: #3a2615;
    --op-bg: #22321e; --op-ln: #80b56e; --def-bg: #1d2a38; --def-ln: #7ca8d8;
    --var-bg: #372a15; --var-ln: #dfa94e; --let-bg: #2b2338; --let-ln: #a98bd4;
    --lit-bg: #262624; --lit-ln: #a3a296; --wire: #6f7c75;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a1f1c; --fg: #e2e8e3; --muted: #97a39c; --line: #2c3530;
  --accent: #5cc4b9; --accent-soft: #19332f; --hot: #f0a15c; --hot-soft: #3a2615;
  --op-bg: #22321e; --op-ln: #80b56e; --def-bg: #1d2a38; --def-ln: #7ca8d8;
  --var-bg: #372a15; --var-ln: #dfa94e; --let-bg: #2b2338; --let-ln: #a98bd4;
  --lit-bg: #262624; --lit-ln: #a3a296; --wire: #6f7c75;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
code, pre, .pill, .fn, .kw, .lbl, .sub, .port, input, textarea { font-family: var(--font-code); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding-block: 4px 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand strong { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg button:disabled { color: var(--muted); opacity: .5; cursor: default; }

.status { padding: 7px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); margin-bottom: 12px; }
.status.live { color: var(--fg); border-color: var(--hot); background: var(--hot-soft); }

.grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 300px;
  grid-template-rows: auto 1fr; grid-template-areas: "blocks graph side" "text text side"; align-items: start; }
.p-blocks { grid-area: blocks; } .p-graph { grid-area: graph; } .p-text { grid-area: text; } .p-net { grid-area: net; }
.grid.is-net { grid-template-areas: "net net side" "text text side"; }
.grid.is-typed { grid-template-areas: "graph graph side" "blocks text side"; }
.side { grid-area: side; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 1100px) {
  .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "blocks blocks" "graph side" "text side"; }
  .grid.is-net { grid-template-areas: "net net" "text side"; }
  .grid.is-typed { grid-template-areas: "graph graph" "blocks blocks" "text side"; }
}
@media (max-width: 720px) {
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "blocks" "side" "graph" "text"; }
  .grid.is-net { grid-template-areas: "net" "side" "text"; }
  .grid.is-typed { grid-template-areas: "graph" "blocks" "side" "text"; }
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.panel h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.panel h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }

/* blocks */
.blocks-wrap { overflow-x: auto; padding-bottom: 4px; }
.def-card { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.def-head { display: flex; gap: 8px; align-items: center; }
.blk { position: relative; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px;
  border: 1.5px solid var(--ln); background: var(--bg-k); cursor: pointer; max-width: 100%; }
.blk.op { --ln: var(--op-ln); --bg-k: var(--op-bg); }
.blk.def { --ln: var(--def-ln); --bg-k: var(--def-bg); }
.blk.let { --ln: var(--let-ln); --bg-k: var(--let-bg); flex-direction: column; align-items: flex-start; }
.blk.lam { --ln: var(--let-ln); --bg-k: var(--panel); border-style: solid; }
.blk .blk { background: color-mix(in srgb, var(--bg-k) 70%, var(--panel)); }
.blk.sel, .pill.sel { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { position: absolute; top: -9px; left: 8px; font: 500 11px var(--font-ui); padding: 0 6px; border-radius: 6px; background: var(--accent); color: var(--panel); }
.blk:has(> .tag) { margin-top: 8px; padding-top: 10px; }
.note-dot { position: absolute; top: -4px; right: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--hot); }
.fn { font-weight: 500; padding: 0 2px; }
.kw { color: var(--muted); font-size: 13px; }
.pill { border: 1.5px solid var(--ln); background: var(--bg-k); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.pill.var { --ln: var(--var-ln); --bg-k: var(--var-bg); }
.pill.def { --ln: var(--def-ln); --bg-k: var(--def-bg); font-weight: 500; }
.pill.op { --ln: var(--op-ln); --bg-k: var(--op-bg); }
.pill.lit { --ln: var(--lit-ln); --bg-k: var(--lit-bg); border-radius: 6px; }
.pill.hole { --ln: var(--muted); --bg-k: transparent; border-style: dashed; border-radius: 6px; color: var(--muted); }
.pill.binder { font-style: italic; }

/* graph */
.graph-wrap { overflow: auto; max-height: 520px; }
/* Every graph is a window onto an unbounded plane (editor/canvas.ts). */
.canvas-wrap { position: relative; height: 480px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; }
.canvas-wrap svg.canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.canvas-wrap svg.canvas.panning { cursor: grabbing; }
.canvas-wrap svg.canvas text { user-select: none; -webkit-user-select: none; }
.canvas-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.canvas-tools .btn { padding: 2px 8px; font-size: 12px; }
.define .eq { margin: 6px 0; padding: 6px 8px; background: var(--bg); border-radius: 6px; font: 13px var(--font-code); }
.define .ways { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 4px; font-size: 12px; }
.define .ways li { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.define .given { color: var(--muted); min-width: 92px; }
.graph { display: block; max-width: none; touch-action: none; }
.wire { fill: none; stroke: var(--wire); stroke-width: 1.6; }
.port { fill: var(--muted); font-size: 10px; }
.gn { cursor: grab; }
.gn rect { fill: var(--op-bg); stroke: var(--op-ln); stroke-width: 1.5; }
.gn.def rect { fill: var(--def-bg); stroke: var(--def-ln); }
.gn.var rect { fill: var(--var-bg); stroke: var(--var-ln); }
.gn.let rect { fill: var(--let-bg); stroke: var(--let-ln); }
.gn.lit rect, .gn.lam rect { fill: var(--lit-bg); stroke: var(--lit-ln); }
.gn.hole rect { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }
.gn.out rect { fill: var(--panel); stroke: var(--fg); }
.gn.sel rect { stroke: var(--accent); stroke-width: 3; }
.gn .lbl { fill: var(--fg); font-size: 13px; }
.gn .sub { fill: var(--accent); font: italic 11px var(--font-ui); }

/* text */
.text-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.text-head h2 { margin: 0; }
.text { margin: 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.6; }

/* side */
.empty, .hint { color: var(--muted); font-size: 13px; margin: 6px 0; }
.insp { display: flex; flex-direction: column; gap: 8px; }
.insp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kind { font-weight: 600; font-size: 15px; }
.nid { color: var(--muted); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field span, .sub-head { font-size: 12px; color: var(--muted); }
.sub-head { margin-top: 6px; }
input, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 13px; }
textarea { resize: vertical; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
a.btn { color: inherit; text-decoration: none; font: inherit; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.ghost { align-self: flex-start; }
.btn.danger:hover { border-color: var(--hot); color: var(--hot); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.mini { padding: 1px 7px; font-size: 12px; }
select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 13px; }
.structure { display: flex; flex-direction: column; gap: 6px; }
.srow { display: flex; align-items: center; gap: 4px; }
.slink { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-family: var(--font-code); font-size: 13px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slink:hover { background: var(--accent-soft); }
.picker { display: flex; flex-direction: column; gap: 6px; }
.opts { display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow-y: auto; }
.opt { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.opt:hover, .opt:focus-visible { background: var(--accent-soft); }
.opt-l { font-family: var(--font-code); }
.opt-d { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.files { display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.meaning { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 8px; border-radius: 8px; background: var(--accent-soft); margin-bottom: 6px; }
.meaning code { text-align: right; font-size: 12px; }
.meaning .chip { grid-column: 1 / -1; font-size: 12px; color: var(--accent); }
.meaning.moved { background: var(--hot-soft); }
.meaning.moved .chip { color: var(--hot); font-weight: 600; }
.file { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 4px 6px; border-radius: 6px; font-size: 12px; }
.file code { color: var(--muted); }
.fname { font-family: var(--font-code); overflow: hidden; text-overflow: ellipsis; }
.fsize { color: var(--muted); min-width: 52px; text-align: right; }
.file.hot { background: var(--hot-soft); }
.file.hot .fname { color: var(--hot); font-weight: 500; }

.run { display: flex; flex-direction: column; gap: 8px; }
.args { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px; }
.arg { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.arg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-family: var(--font-code); }
.result code { font-size: 16px; font-weight: 500; text-align: right; }
.result code.err { font-size: 13px; font-weight: 400; color: var(--hot); }

/* inline views */
.blk.virtual, .pill.virtual { border-style: dashed; }
.blk.inlined { --ln: var(--def-ln); }
.tag.inl { background: var(--def-ln); }
.gn.virtual rect { stroke-dasharray: 5 3; }
.btn.back { font-weight: 600; }
.netmark { color: var(--accent); }

/* network editor */
.net-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.legend { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--muted); font-size: 12px; margin-left: auto; }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 2px solid var(--wire); }
.lg.in { background: var(--panel); border-color: var(--wire); }
.lg.out { background: var(--let-ln); border-color: var(--let-ln); }
.lg.free { background: var(--panel); border-style: dashed; }
.graph.net { touch-action: none; }
.nb { cursor: grab; }
/* Network nodes use the same look as every other graph: a node is green,
   a given port is a hollow input, a solved port is a filled dot, and an
   outer port is a dot (known) or a result (unknown) with its label. */
.nb .body { fill: var(--op-bg); stroke: var(--op-ln); stroke-width: 1.5; }
.nb.const .body { fill: var(--lit-bg); stroke: var(--lit-ln); }
.nb.ext .body { fill: transparent; stroke: none; }
.nb.sel .body { stroke: var(--accent); stroke-width: 3; }
.nb.ext.sel .body { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
.nb .lbl { fill: var(--fg); font-size: 13px; font-weight: 500; }
.nb .sub { fill: var(--muted); font: italic 11px var(--font-ui); }
.nb .val { fill: var(--accent); font-size: 12px; font-family: var(--font-code); }
.nb .sep { display: none; }
.plbl { fill: var(--var-ln); font-size: 11px; }
.dot { fill: var(--panel); stroke: var(--wire); stroke-width: 2; stroke-dasharray: 3 2; cursor: crosshair; }
.dot.bound { stroke-dasharray: none; }
.dot.in { fill: var(--panel); stroke: var(--wire); }
.dot.out { fill: var(--let-ln); stroke: var(--panel); stroke-width: 1.5; }
.nb.ext.in .dot { fill: var(--let-ln); stroke: var(--panel); stroke-width: 1.5; }
.nb.ext.out .dot { fill: var(--panel); stroke: var(--wire); stroke-width: 2; }
.dot:hover { stroke-width: 3.5; }
.wire.sel { stroke: var(--accent); stroke-width: 3; }
.wire.pending { stroke: var(--accent); stroke-dasharray: 5 4; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.wire-lbl { fill: var(--muted); font: italic 11px var(--font-ui); }
.check { display: flex; gap: 8px; align-items: center; }
.check input { width: auto; }
.ports { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.prow { display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; align-items: center; }
.pdir { font: 500 11px var(--font-code); text-align: center; border-radius: 4px; padding: 1px 0; border: 1px solid var(--line); color: var(--muted); }
.pdir.in { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pdir.out { background: var(--hot-soft); color: var(--hot); border-color: transparent; }
.pw { color: var(--muted); font-family: var(--font-code); font-size: 12px; }
.status-line { margin: 0; font-size: 13px; padding: 6px 8px; border-radius: 6px; }
.status-line.warn { background: var(--hot-soft); color: var(--hot); }
.status-line.bad { background: var(--hot-soft); color: var(--hot); font-weight: 500; }
.alts summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.alt { font-family: var(--font-code); font-size: 12px; padding: 2px 0 2px 12px; }

/* error prevention */
.nb.atom .lbl { font-size: 16px; }
.punit { fill: var(--def-ln); color: var(--def-ln); font: 500 10px var(--font-code); }
.nb .val.unit { fill: var(--def-ln); }
.dragging .dot { transition: opacity .1s; }
.dragging .dot.cannot { opacity: .25; stroke-dasharray: none; stroke: var(--hot); }
.dragging .dot.can { stroke: var(--accent); stroke-width: 3.5; stroke-dasharray: none; }
.wire.pending.bad { stroke: var(--hot); }
.why { fill: var(--hot); font: 600 12px var(--font-ui); pointer-events: none; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.wire.pending { pointer-events: none; }
.status.refused { color: var(--hot); border-color: var(--hot); background: var(--hot-soft); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip-btn { font: 500 12px var(--font-code); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.chip-btn.on { background: var(--def-ln); border-color: var(--def-ln); color: var(--panel); }
.chip-btn:disabled { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
.opt.no { opacity: .5; cursor: not-allowed; }
.opt.no .opt-d { color: var(--hot); }
.checks { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.chk { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: baseline; }
.chk-n { font: 600 12px var(--font-code); text-align: center; border-radius: 4px; padding: 1px 0; background: var(--accent-soft); color: var(--accent); }
.chk.gap .chk-n { background: var(--var-bg); color: var(--var-ln); }
.chk.bad .chk-n { background: var(--hot); color: var(--panel); }
.chk.later .chk-n { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.chk-t small { display: block; color: var(--muted); font-size: 11.5px; }
.chk-item { margin-left: 34px; text-align: left; background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }

/* typed programs */
.typed { font: 13.5px/1.7 var(--font-code); overflow-x: auto; padding: 4px 2px; }
.typed .ln { white-space: pre-wrap; }
.typed .blk { display: block; }
.palette .opt-l { white-space: nowrap; flex-shrink: 0; }
.typed .ind { padding-left: 22px; border-left: 1px dotted var(--line); margin-left: 3px; }
.typed .cmt { color: var(--muted); font-style: italic; margin-bottom: 4px; }
.typed .x { border-radius: 4px; cursor: pointer; }
.typed span.x:hover { background: var(--accent-soft); }
.typed .x.sel { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--accent-soft); }
.typed .x.err { text-decoration: wavy underline var(--hot); }
.typed .kw { color: var(--let-ln); font-weight: 500; }
.typed .pn { color: var(--muted); }
.typed .con { color: var(--var-ln); font-weight: 500; }
.typed .ref.def, .typed .ref.fn { color: var(--def-ln); }
.typed .op { color: var(--op-ln); }
.typed .lit { color: var(--accent); }
.typed .ty { color: var(--muted); font-size: 11.5px; opacity: .85; }
.typed .ty.big { font-size: 12.5px; opacity: 1; }
.typed .bnd .ty { display: none; }
.typed .bnd.sel .ty, .typed .bnd:hover .ty { display: inline; }
.typed .hole { display: inline-block; padding: 0 6px; border: 1.5px dashed var(--hot); color: var(--hot); background: var(--hot-soft); line-height: 1.45; }
.typed .hole .ty { color: var(--hot); margin-left: 6px; }
.typed .arm { border-radius: 4px; }
.typed .variant { padding-left: 2px; }
.typeline { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.typeline span { color: var(--muted); }
.typeline code { color: var(--def-ln); font-weight: 500; overflow-wrap: anywhere; }
.palette { max-height: 340px; }
.pal-g { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 6px 8px 2px; }
pre.out { max-height: 260px; overflow: auto; margin: 8px 0 0; }

/* typed graph */
.tgraph { font: 12px var(--font-code); touch-action: none; }
.tgraph .tw { fill: none; stroke: var(--wire); stroke-width: 1.6; }
.tgraph .cn.case { fill: var(--var-bg); stroke: var(--var-ln); }
.wire-pending { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; pointer-events: none; }
.wire-pending.bad { stroke: var(--hot); }
.tgraph [data-move] { cursor: move; }
.tgraph .outp[data-out] { cursor: crosshair; }
.tgraph .rg { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.tgraph .rg.def { fill: none; stroke: var(--def-ln); }
.tgraph .rg.lam { fill: var(--def-bg); fill-opacity: .35; stroke: var(--def-ln); stroke-dasharray: 4 3; }
.tgraph .rg.let { fill: var(--let-bg); fill-opacity: .35; stroke: var(--let-ln); stroke-dasharray: 4 3; }
.tgraph .rg.match, .tgraph .rg.fold { fill: var(--var-bg); fill-opacity: .25; stroke: var(--var-ln); }
.tgraph .rg.arm { fill: var(--panel); stroke: var(--var-ln); stroke-opacity: .6; }
.tgraph .rg.sel, .tgraph .cn.sel, .tgraph .pill.sel, .tgraph .dia.sel, .tgraph .src.sel { stroke: var(--accent); stroke-width: 3; }
.tgraph .rt { fill: var(--muted); font: italic 11px var(--font-ui); }
.tgraph .cn { fill: var(--op-bg); stroke: var(--op-ln); stroke-width: 1.5; cursor: pointer; }
.tgraph .cn.eff { fill: var(--hot-soft); stroke: var(--hot); }
.tgraph .cn.handler { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 2; }
.tgraph .cn.err, .tgraph .pill.err { stroke: var(--hot); stroke-width: 3; }
.tgraph .cl { fill: var(--fg); font-size: 13px; font-weight: 500; pointer-events: none; }
.tgraph .badge { fill: var(--hot); font: 600 9.5px var(--font-ui); letter-spacing: .02em; pointer-events: none; }
.tgraph .pill { stroke-width: 1.4; cursor: pointer; }
.tgraph .pill.var { fill: var(--var-bg); stroke: var(--var-ln); cursor: grab; }
.tgraph .pill.lit { fill: var(--lit-bg); stroke: var(--lit-ln); }
.tgraph .pill.con { fill: var(--var-bg); stroke: var(--var-ln); stroke-dasharray: 2 2; }
.tgraph .pill.fnref { fill: var(--def-bg); stroke: var(--def-ln); }
.tgraph .pill.hole { fill: var(--hot-soft); stroke: var(--hot); stroke-dasharray: 4 3; }
.tgraph .pl { fill: var(--fg); pointer-events: none; }
.tgraph .dia { fill: var(--var-ln); stroke: var(--var-ln); cursor: pointer; }
.tgraph .inp { fill: var(--panel); stroke: var(--wire); stroke-width: 2; cursor: crosshair; }
.tgraph .outp { fill: var(--wire); }
.tgraph .src { fill: var(--let-ln); stroke: var(--panel); stroke-width: 1.5; cursor: grab; }
.guide { margin: 0 16px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.guide-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px 18px; }
.guide-item { display: flex; gap: 10px; align-items: flex-start; }
.guide-item svg { flex: none; }
.guide-item p { margin: 2px 0 0; font-size: 13px; line-height: 1.4; }
.tgraph .reroute { fill: var(--let-ln); stroke: var(--panel); stroke-width: 1.5; cursor: grab; }
.tgraph .reroute.silent { fill: var(--panel); stroke: var(--let-ln); stroke-width: 1.5; cursor: default; }
.tgraph .reroute.sel { stroke: var(--accent); stroke-width: 3; }
.tgraph .dotl { fill: var(--fg); font: 600 11px var(--font-code); pointer-events: none; }
.tgraph .dotl.anon { fill: var(--muted); font-weight: 400; }
.tgraph .tw.use { stroke: var(--let-ln); stroke-width: 1.8; pointer-events: none; }
.tgraph .tw.use.lit { stroke: var(--accent); stroke-width: 2.6; }
.tgraph .use-hit, .tgraph .edge-hit { fill: none; stroke: transparent; stroke-width: 10; pointer-events: stroke; }
.tgraph .use-hit { stroke-width: 6; }
.tgraph .use-hit { cursor: pointer; }
.tgraph .edge-hit, .tgraph .tw[data-edge] { cursor: copy; }
.tgraph .edge-hit:hover + .tw, .tgraph .tw[data-edge]:hover { stroke: var(--accent); stroke-width: 2.4; }
.tgraph .inp.use { fill: var(--let-ln); stroke: var(--let-ln); }
.tgraph .portl { fill: var(--var-ln); font-size: 11px; pointer-events: none; }
.tgraph.dragging .cannot { opacity: .25; }
.tgraph.dragging .inp.can, .tgraph.dragging .pill.can { stroke: var(--accent); stroke-width: 3.5; }
.tgraph .why { fill: var(--hot); font: 600 12px var(--font-ui); pointer-events: none; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }

@media (prefers-reduced-motion: no-preference) {

}
