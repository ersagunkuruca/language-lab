# The tests a merge to main can reach, beside the deploy instead of before
# it (projectional/TESTING.md, T1 and T2): projectional/test/affected.ts
# picks them from what changed since the last commit this workflow passed,
# from unit tests to the editor in a browser and WGSL on a GPU. A red run
# doesn't stop the site; it is main's to fix, by the next pull request. A
# pull request itself only type-checks (test.yml).
name: Check main

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!**.png"
      - "!**.jpg"
      - "!**.gif"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Merges that land during a run wait, and only the newest of them runs
# next. It tests what changed since the last green run, so the ones
# skipped lose nothing.
concurrency:
  group: check-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projectional/package-lock.json
      - run: npm ci
        working-directory: projectional
      # Since the last green run; with none, everything.
      - name: What changed
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list -R "$GITHUB_REPOSITORY" -w check-main.yml -b main -s success -L 1 --json headSha -q '.[0].headSha' || true)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then echo "base=$base" >> "$GITHUB_OUTPUT"; else echo "base=--all" >> "$GITHUB_OUTPUT"; fi
      # The big sweeps check one eighth of their cases, a different eighth
      # each run (test/helpers.ts sweep, TESTING.md T3).
      - name: The tests the change reaches
        env:
          SWEEP_AT: ${{ github.run_number }}
        run: node projectional/test/affected.ts ${{ steps.base.outputs.base }} HEAD
