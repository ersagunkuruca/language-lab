# The tests a merge to main can reach, beside the deploy instead of before
# it (docs/process/TESTING.md, T1 and T2): ters/test/affected.ts
# picks them from what changed since the last commit this workflow finished
# testing (green or red).
# The browser tests (the editor, shaders, sound, WGSL on a GPU) took 8.5
# of a run's 10 minutes, so they run in nightly.yml instead (T8). A red run
# doesn't stop the site; it is main's to fix, by the next pull request. A
# pull request itself only type-checks (test.yml).
name: Check main

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!**.png"
      - "!**.jpg"
      - "!**.gif"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Merges that land during a run wait, and only the newest of them runs
# next. It tests what changed since the last green run, so the ones
# skipped lose nothing.
concurrency:
  group: check-main
  cancel-in-progress: false

jobs:
  # Since the last run that finished its tests, green or red (a red
  # one's failures are main's to fix by the next pull request, and the
  # nightly run tests everything again). Not since the last green one:
  # with none for a while, every run tested everything, ran into the
  # timeout (shown as cancelled), and so never went green either
  # (I110: 38 of 40 runs cancelled). With none at all, the last merge.
  base:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list -R "$GITHUB_REPOSITORY" -w check-main.yml -b main -L 100 --json headSha,conclusion -q '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""' || true)
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then echo "base=$base" >> "$GITHUB_OUTPUT"; else echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"; fi

  # Every file the change reaches, the slow ones too: before the merge
  # only the fast set ran (T13, ters/test/slow.json). The big sweeps check
  # one eighth of their cases, a different eighth each run (test/helpers.ts
  # sweep, TESTING.md T3).
  # In six parallel shares of the test files, balanced by how long each
  # took (ters/test/nightly-times.json), as the Nightly is (I208): in one
  # job, a change that reached most files ran past the 20-minute timeout,
  # and 94 of 100 runs to 11-13 were cancelled so (T15). Each run is
  # green only when all six are.
  check:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      # Each test against its own last run in the test map (T16c): it runs
      # when a line it ran or a file it read changed since, or it failed
      # then; one the map hasn't got goes by imports from the base. Each
      # file alone with coverage on, so what it ran and read goes back into
      # the map (ters/test/test-map.ts, T16).
      - name: Share ${{ matrix.shard }} of the tests the change reaches
        env:
          SWEEP_AT: ${{ github.run_number }}
        run: node ters/test/affected.ts ${{ needs.base.outputs.base }} HEAD --since-map --shard ${{ matrix.shard }}/6 --record map-part.json --bisect
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-part-${{ matrix.shard }}
          path: map-part.json
          if-no-files-found: ignore
          retention-days: 1

  # What the shares recorded, red or green, onto the test-map branch.
  map:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: map-part-*
          path: parts
      - name: Publish the test map
        run: node ters/test/publish-map.ts $(find parts -name map-part.json)
