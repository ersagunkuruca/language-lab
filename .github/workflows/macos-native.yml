# Every example as `ters native` builds it on a Mac (C294,
# docs/design/targets/DESKTOP-APPS.md): clang and Apple's libc, fibers by
# setjmp as on iOS. Each prints what `ters run` prints
# (.github/macos/native-sweep.ts). Run by hand only: a macOS minute
# costs ten of Linux's.
name: macOS native

on:
  workflow_dispatch:
    inputs:
      examples:
        description: "Examples to sweep, separated by spaces (empty: all)"
        default: ""
        required: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      - name: Every example, native beside ters run
        env:
          EXAMPLES: ${{ inputs.examples }}
        run: node .github/macos/native-sweep.ts $EXAMPLES
