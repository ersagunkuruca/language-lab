# Builds the projectional editor and publishes it to GitHub Pages on every
# push to main.
#
# The site has the same layout as the repository: the root index.html sends
# visitors to projectional/editor/dist/. That matters because Pages may also
# be building straight from the branch ("Deploy from a branch"); both deploys
# then publish the same files, so whichever finishes last, every URL stays
# the same. Setting Settings → Pages → Source to "GitHub Actions" turns the
# branch build off.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the editor
        working-directory: projectional
        run: |
          npm ci
          npm test
          npm run build-editor
      - name: Lay out the site like the repository
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/projectional/editor/dist
          cp -r projectional/editor/dist _site/projectional/editor/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
