# Builds the projectional editor and publishes it to GitHub Pages on every
# push to main. Pages must be set to "GitHub Actions" as its source once
# (Settings → Pages → Build and deployment → Source).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the editor
        working-directory: projectional
        run: |
          npm ci
          npm test
          npm run build-editor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projectional/editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
