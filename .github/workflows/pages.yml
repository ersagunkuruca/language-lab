# Publishes the site on every push to main: the repository as it is, plus
# the pages the editor build writes at its root (index.html is the editor,
# so the editor is the home page, with no redirect). The built pages are not
# committed, so parallel pull requests never conflict over them.
#
# Needs Settings → Pages → Source: "GitHub Actions".
#
# Before publishing, it runs every test suite: the unit tests, then the
# browser tests (the editor, every example, shaders.html, WGSL on a GPU) on
# what it built. They run here, once per merge, instead of on every push to
# a pull request (which only type-checks). If they fail, nothing is
# published and the live site keeps the last good build.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that has started finishes (cancelling it would waste the minutes
# it spent); merges that land meanwhile wait, and only the newest of them
# runs next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projectional/package-lock.json
      - name: Build the pages
        working-directory: projectional
        run: |
          npm ci
          npm run build-editor
      # Node runs (cores - 1) test files at a time, which is one on the
      # runner's two cores; two at a time is much faster.
      - name: Unit tests
        run: |
          (cd projectional && node --test --test-concurrency=2 test/*.test.ts)
          (cd invertible && npm test)
          (cd compiler && npm test)
      - name: The editor in a browser
        working-directory: projectional
        run: |
          npm run smoke
          npm run smoke-shaders
      - name: compiler's WGSL on a GPU (WebGPU in headless Chrome)
        working-directory: compiler
        run: npm run gpu
      - name: Lay out the site like the repository
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          cp -r index.html tutorial.html reactive.html shaders.html apps _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
