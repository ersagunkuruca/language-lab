# Builds the projectional editor and publishes it to GitHub Pages on every
# push to main.
#
# The site is the repository as it is: the editor build writes index.html
# and tutorial.html at the root, so the editor is the home page. GitHub's
# own branch build ("Deploy from a branch") publishes those same files, so
# both deploys agree. Setting Settings → Pages → Source to "GitHub Actions"
# turns the duplicate branch build off.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the editor
        working-directory: projectional
        run: |
          npm ci
          npm test
          npm run build-editor
          npm run smoke
      - name: Lay out the site like the repository
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          cp index.html tutorial.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
