# Publishes the site on every push to main: the repository as it is, plus
# the pages the editor build writes at its root (index.html is the editor,
# so the editor is the home page, with no redirect). The built pages are not
# committed, so parallel pull requests never conflict over them.
#
# Needs Settings → Pages → Source: "GitHub Actions".
#
# It only builds and deploys, so a merge is live in about two minutes. The
# test suites run beside it in check-main.yml and report: a failure there
# is fixed by the next pull request, but doesn't hold back the site
# (docs/process/TESTING.md, T1).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that has started finishes; merges that land meanwhile wait, and
# only the newest of them runs next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projectional/package-lock.json
      - name: Build the pages
        working-directory: projectional
        run: |
          npm ci
          npm run build-editor
      - name: Lay out the site like the repository
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          cp -r index.html learn.html tutorial.html guide.html reactive.html shaders.html apps _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
