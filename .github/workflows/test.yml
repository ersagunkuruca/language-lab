# A pull request's only check: TypeScript's type check, under a minute.
name: Tests

# A pull request that only changes prose or pictures (a review, a QA
# report, notes) has nothing to type-check, so it doesn't start a run.
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!**.png"
      - "!**.jpg"
      - "!**.gif"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The unit suites run once per merge in check-main.yml, beside the deploy,
# and the browser tests (the editor, shaders, sound, WGSL on a GPU) once a
# night in nightly.yml: a failure there is reported, and the next pull
# request fixes main. Run the unit suites locally before pushing.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projectional/package-lock.json
      - name: projectional
        working-directory: projectional
        run: |
          npm ci
          npm run typecheck
