# Runs the unit test suites on pull requests.
name: Tests

# A pull request that only changes prose or pictures (a review, a QA
# report, notes) has nothing to test, so it doesn't start a run. Markdown
# that a build or test reads is the exception: TUTORIAL.md becomes
# tutorial.html.
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!**.png"
      - "!**.jpg"
      - "!**.gif"
      - "projectional/TUTORIAL.md"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The browser tests (the editor, shaders, WGSL on a GPU) don't run here: a
# pull request runs them locally before it's pushed, and pages.yml runs them
# once per merge before it publishes, so a failure never reaches the site.
jobs:
  unit:
    runs-on: ubuntu-latest
    # A hang stops at 15 minutes instead of GitHub's 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projectional/package-lock.json
      # Node runs (cores - 1) test files at a time, which is one on the
      # runner's two cores; two at a time takes 2.5 minutes instead of 4.
      - name: projectional
        working-directory: projectional
        run: |
          npm ci
          npm run typecheck
          node --test --test-concurrency=2 test/*.test.ts
      - name: invertible
        working-directory: invertible
        run: npm test
      - name: compiler
        working-directory: compiler
        run: npm test
