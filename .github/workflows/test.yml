# Runs every test suite on pull requests. The browser tests run against a
# build made here; the built pages aren't committed (pages.yml builds and
# publishes them on main, without testing again).
name: Tests

# A pull request that only changes prose or pictures (a review, a QA
# report, notes) has nothing to test, so it doesn't start a run. Markdown
# that a build or test reads is the exception: TUTORIAL.md becomes
# tutorial.html.
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!**.png"
      - "!**.jpg"
      - "!**.gif"
      - "projectional/TUTORIAL.md"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes about 8 minutes. A hang (a GPU test that never returns, a
    # browser that never closes) stops at 20 instead of GitHub's 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: projectional
        working-directory: projectional
        run: |
          npm ci
          npm test
      - name: projectional editor in a browser
        working-directory: projectional
        run: |
          npm run build-editor
          npm run smoke
          npm run smoke-shaders
      - name: invertible
        working-directory: invertible
        run: npm test
      - name: compiler
        working-directory: compiler
        run: npm test
      - name: compiler's WGSL on a GPU (WebGPU in headless Chrome)
        working-directory: compiler
        run: npm run gpu
