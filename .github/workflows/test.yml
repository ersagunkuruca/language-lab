# Runs every test suite on pull requests.
#
# There is no deploy workflow: GitHub Pages ("Deploy from a branch", main,
# root) publishes the repository as it is, and the editor build writes the
# site's pages into it (index.html, tutorial.html, ...). So a pull request
# must commit a fresh build, and this checks that it did. Before, a second
# workflow rebuilt and retested everything on every push to main, which was
# half the project's Actions minutes and often cancelled by the next merge.
name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: projectional
        working-directory: projectional
        run: |
          npm ci
          npm test
      - name: projectional editor in a browser
        working-directory: projectional
        run: |
          npm run build-editor
          git diff --exit-code --stat -- ../index.html ../tutorial.html ../reactive.html ../shaders.html ../apps || {
            echo "::error::The committed site is older than the source. Run npm run build-editor in projectional/ and commit the pages it writes."
            exit 1
          }
          npm run smoke
          npm run smoke-shaders
      - name: invertible
        working-directory: invertible
        run: npm test
      - name: compiler
        working-directory: compiler
        run: npm test
      - name: compiler's WGSL on a GPU (WebGPU in headless Chrome)
        working-directory: compiler
        run: npm run gpu
