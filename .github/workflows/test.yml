# Runs every test suite on pull requests. The browser tests run against a
# build made here; the built pages aren't committed (pages.yml builds and
# publishes them on main, without testing again).
name: Tests

# A pull request that only changes prose or pictures (a review, a QA
# report, notes) has nothing to test, so it doesn't start a run. Markdown
# that a build or test reads is the exception: TUTORIAL.md becomes
# tutorial.html.
on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!**.png"
      - "!**.jpg"
      - "!**.gif"
      - "projectional/TUTORIAL.md"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Two jobs side by side, so a pull request waits for the slower one (about
# 4 minutes) instead of both in a row (about 7.5). Each pays its own setup
# (about 20 seconds), so the runner minutes stay about the same.
jobs:
  unit:
    runs-on: ubuntu-latest
    # A hang stops at 15 minutes instead of GitHub's 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projectional/package-lock.json
      # Node runs (cores - 1) test files at a time, which is one on the
      # runner's two cores; two at a time takes 2.5 minutes instead of 4.
      - name: projectional
        working-directory: projectional
        run: |
          npm ci
          node --test --test-concurrency=2 test/*.test.ts
      - name: invertible
        working-directory: invertible
        run: npm test
      - name: compiler
        working-directory: compiler
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projectional/package-lock.json
      - name: projectional editor in a browser
        working-directory: projectional
        run: |
          npm ci
          npm run build-editor
          npm run smoke
          npm run smoke-shaders
      - name: compiler's WGSL on a GPU (WebGPU in headless Chrome)
        working-directory: compiler
        run: npm run gpu
