# A program's page as an Android app (C198, WEB.md "Mobile"): `ters
# build-app`, then the Capacitor project it makes built into a debug APK,
# kept as the run's artifact to install on a phone. With `kind` native
# (C199c, NATIVE-APPS.md): `ters build-native-app`, the page's C and
# Android's own views with no webview, built by Gradle and the NDK. Run by hand only
# (Actions tab, "Android app", Run workflow), since containers can't reach
# Google's Android SDK and a run costs build minutes.
name: Android app

on:
  workflow_dispatch:
    inputs:
      program:
        description: "Example to build (a folder in ters/examples)"
        default: dice
        required: true
      kind:
        description: "webview (Capacitor) or native (C and Android's views)"
        type: choice
        options: [webview, native]
        default: webview

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: ters
      # One debug key for every run (a debug key, not a secret), so a new
      # build installs over the one on the phone instead of being refused.
      # Given to Gradle as Android Studio gives its signing key (a key in
      # ~/.android wasn't used: I198), and checked on the APK after.
      - name: Debug key
        run: echo "SIGN=-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/.github/android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android" >> "$GITHUB_ENV"
      - name: ters build-app
        if: inputs.kind == 'webview'
        working-directory: ters
        env:
          PROGRAM: ${{ inputs.program }}
        run: node cli/ters.ts build-app "examples/$PROGRAM" -o "$RUNNER_TEMP/app"
      - name: Capacitor project
        if: inputs.kind == 'webview'
        working-directory: ${{ runner.temp }}/app
        run: |
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android
      - name: Debug APK
        if: inputs.kind == 'webview'
        working-directory: ${{ runner.temp }}/app/android
        env:
          RUN: ${{ github.run_number }}
        run: |
          sed -i "s/versionCode 1\b/versionCode $RUN/" app/build.gradle
          ./gradlew assembleDebug --no-daemon $SIGN
      - name: ters build-native-app
        if: inputs.kind == 'native'
        working-directory: ters
        env:
          PROGRAM: ${{ inputs.program }}
        run: node cli/ters.ts build-native-app "examples/$PROGRAM" -o "$RUNNER_TEMP/app/android"
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.kind == 'native'
        with:
          gradle-version: "8.11.1"
      - name: Native debug APK
        if: inputs.kind == 'native'
        working-directory: ${{ runner.temp }}/app/android
        env:
          TERS_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon $SIGN
      - name: Signed with the one key
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in "$RUNNER_TEMP"/app/android/app/build/outputs/apk/debug/*.apk; do
            "$tools/aapt2" dump badging "$apk" | head -1
            "$tools/apksigner" verify --print-certs "$apk" 2>/dev/null | grep "SHA-256" | tee /dev/stderr | grep -q 61df053836f4ca3208fc38ab4903810a7925d55ee8c30c467e25b1176be45c74
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.program }}-android-${{ inputs.kind }}
          path: ${{ runner.temp }}/app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
