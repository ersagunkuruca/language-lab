# Once a night, when main has changed since the last run: the tests whose
# code or data changed since they last ran and the ones due for review
# (T16c), every sweep in full; every definition in the smoke, the GPU check
# (docs/process/TESTING.md, T5). The runs after each merge test only what
# the merge reaches and a slice of each sweep; this is where whatever they
# skipped gets checked. Green moves the `good` tag to what it tested, so
# running Pages by hand on `good` puts back the last fully checked site.
#
# In parallel jobs (I208, Ersagun's OK 2026-11-12): one job did it all and
# hit its 30-minute limit every night from 10-31 (195 CPU-minutes of test
# files, 49 minutes on the runner's 4 cores before the browser tests).
# Four shares of the test files, balanced by how long each took
# (ters/test/nightly-times.json, `affected.ts --time` with SWEEP=all), and
# the browser tests in a job of their own.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed since the last full run?
        id: changed
        run: |
          if [ "$(git rev-parse -q --verify 'refs/tags/good^{commit}')" = "$(git rev-parse HEAD)" ]; then echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi

  tests:
    needs: changed
    if: needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      # Not every test (T16c): those whose lines or files changed since they
      # last ran, those that failed, those not in the test map, and those
      # whose review is due (1, 2, 4, then 7 days of clean runs;
      # ters/test/schedule.ts), each sweep in full. Each file alone with
      # coverage on, so what it ran and read goes into the test map.
      - name: Share ${{ matrix.shard }} of the test files
        run: node ters/test/affected.ts --due --shard ${{ matrix.shard }}/4 --record map-part.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-part-${{ matrix.shard }}
          path: map-part.json
          if-no-files-found: ignore
          retention-days: 1

  # What the shares recorded, red or green, onto the test-map branch.
  map:
    needs: [changed, tests]
    if: always() && needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: map-part-*
          path: parts
      - name: Publish the test map
        run: node ters/test/publish-map.ts $(find parts -name map-part.json)

  browser:
    needs: changed
    if: needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      - name: The browser tests
        run: node ters/test/affected.ts --all --browser-only

  good:
    needs: [tests, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the good tag
        run: |
          git tag -f good HEAD
          git push -f origin refs/tags/good
