# Once a night, when main has changed since the last run: the tests whose
# code or data changed since they last ran and the ones due for review
# (T16c), every sweep in full; every definition in the smoke, the GPU check
# (docs/process/TESTING.md, T5). The runs after each merge test only what
# the merge reaches and a slice of each sweep; this is where whatever they
# skipped gets checked. Green moves the `good` tag to what it tested, so
# running Pages by hand on `good` puts back the last fully checked site.
#
# In parallel jobs (I208, Ersagun's OK 2026-11-12): one job did it all and
# hit its 30-minute limit every night from 10-31 (195 CPU-minutes of test
# files, 49 minutes on the runner's 4 cores before the browser tests).
# Four shares of the test files, balanced by how long each took
# (ters/test/nightly-times.json, `affected.ts --time` with SWEEP=all), and
# the browser tests in a job of their own.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed since the last full run?
        id: changed
        run: |
          if [ "$(git rev-parse -q --verify 'refs/tags/good^{commit}')" = "$(git rev-parse HEAD)" ]; then echo "run=no" >> "$GITHUB_OUTPUT"; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi

  tests:
    needs: changed
    if: needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      # Not every test (T16c): those whose lines or files changed since they
      # last ran, those that failed, those not in the test map, and those
      # whose review is due (1, 2, 4, then 7 days of clean runs;
      # ters/test/schedule.ts), each sweep in full. Each file alone with
      # coverage on, so what it ran and read goes into the test map.
      - name: Share ${{ matrix.shard }} of the test files
        run: node ters/test/affected.ts --due --shard ${{ matrix.shard }}/4 --record map-part.json --bisect
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-part-${{ matrix.shard }}
          path: map-part.json
          if-no-files-found: ignore
          retention-days: 1

  # What the shares recorded, red or green, onto the test-map branch.
  map:
    needs: [changed, tests]
    if: always() && needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: map-part-*
          path: parts
      - name: Publish the test map
        run: node ters/test/publish-map.ts $(find parts -name map-part.json)

  browser:
    needs: changed
    if: needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      - name: The browser tests
        run: node ters/test/affected.ts --all --browser-only

  # The generated programs at the night's seed (T18b): seed 1 and the kept
  # seeds run with the other tests; this one moves every night (days since
  # 1970), so each night tries 40 definitions no run has tried. A red here
  # is a bug the generator found, not a break of main: it doesn't hold the
  # good tag. Keep the seed in compiler/test/fuzz-seeds.json with the row
  # that fixes it.
  seed:
    needs: changed
    if: needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      - name: The generated programs at tonight's seed
        run: |
          seed=$(( $(date -u +%s) / 86400 ))
          echo "Seed $seed" >> "$GITHUB_STEP_SUMMARY"
          SEED=$seed node --test compiler/test/fuzz.test.ts || { echo "Seed $seed found a difference: keep it in compiler/test/fuzz-seeds.json (T18b)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      # Edit sequences at the night's seed (T18g) on five examples, 30 steps each.
      - name: Edit sequences at tonight's seed
        if: always()
        run: |
          seed=$(( $(date -u +%s) / 86400 ))
          EDIT_STEPS=30 EDIT_SEQ="[[\"sort\",$seed],[\"buffer\",$seed],[\"dice\",$seed],[\"effects\",$seed],[\"turtle\",$seed]]" node --test ters/test/edit-sequences.test.ts || { echo "Seed $seed broke an edit law: keep the cut-down steps in ters/test/edit-sequences.test.ts KEPT with a row (T18g)" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

  # Past fixes put back (T18d, ters/test/injections/): each must make a
  # test it names fail, and affected.ts must pick that test before a merge.
  # A red here is a weak test or a hole in the selection, not a break of
  # main: it doesn't hold the good tag.
  injections:
    needs: changed
    if: needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      - name: Each past fix put back is caught
        run: node ters/test/injections.ts

  # Today's evaluator against yesterday's (T18f, compiler/test/fuzz-reference.ts):
  # seed 1 and the night's generated programs, each answer the same. The
  # day-old main, not the good tag: good has stood at 11-14 while the browser
  # job was red (I367), and over 13 days meanings changed on purpose (I293's
  # step counting changed seed 12's g17). A red here is a meaning that changed
  # since yesterday: if no DONE.md row of the day says so, it's a bug. It
  # doesn't hold the good tag.
  reference:
    needs: changed
    if: needs.changed.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ters/package-lock.json
      - run: npm ci
        working-directory: ters
      - name: The evaluator answers as yesterday's
        run: node compiler/test/fuzz-reference.ts --ref "$(git rev-list -1 --before='24 hours ago' HEAD)"

  good:
    needs: [tests, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move the good tag
        run: |
          git tag -f good HEAD
          git push -f origin refs/tags/good
